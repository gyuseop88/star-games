<style>

<div id="app"></div>

<script>
"use strict";
/* ================= 공통 ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}
const params=new URLSearchParams(location.search);
const ROOT='stargames';

/* ================= DB (Firebase 또는 모의 DB) ================= */
let db=null, offset=0;
const now=()=>Date.now()+offset;
function mockDB(){
  // 테스트용 모의 DB (?mock=1): 같은 브라우저의 여러 탭끼리 변경 기록을 주고받아 동기화
  const ch=new BroadcastChannel('sg_mock');const listeners=[];let tree={};
  const parts=p=>p.split('/').filter(Boolean);
  const get=(t,p)=>{let n=t;for(const k of parts(p)){if(n==null||typeof n!=='object')return null;n=n[k];}return n===undefined?null:n;};
  const setAt=(p,v)=>{const ks=parts(p);if(!ks.length){tree=v==null?{}:JSON.parse(JSON.stringify(v));return;}let n=tree;for(let i=0;i<ks.length-1;i++){if(typeof n[ks[i]]!=='object'||n[ks[i]]===null)n[ks[i]]={};n=n[ks[i]];}if(v===null||v===undefined)delete n[ks[ks.length-1]];else n[ks[ks.length-1]]=JSON.parse(JSON.stringify(v));};
  const apply=op=>{op.forEach(([p,v])=>setAt(p,v));};
  const keys=()=>Object.keys(localStorage).filter(k=>k.startsWith('sgop_')).sort();
  const seen=new Set();keys().forEach(k=>{seen.add(k);try{apply(JSON.parse(localStorage.getItem(k)));}catch(e){}});
  const fire=()=>listeners.forEach(l=>{const v=get(tree,l.p);const s=JSON.stringify(v);if(s!==l.last){l.last=s;l.cb({val:()=>v==null?null:JSON.parse(s)});}});
  let seq=0;const commit=op=>{const k='sgop_'+Date.now().toString(36).padStart(10,'0')+'_'+(seq++).toString(36).padStart(4,'0')+Math.random().toString(36).slice(2,6);seen.add(k);try{localStorage.setItem(k,JSON.stringify(op));}catch(e){}apply(op);ch.postMessage({k,op});setTimeout(fire,0);return Promise.resolve();};
  ch.onmessage=e=>{if(seen.has(e.data.k))return;seen.add(e.data.k);apply(e.data.op);fire();};
  const ref=p=>({
    set(v){return commit([[p,v]]);},
    update(o){return commit(Object.keys(o).map(k=>[p+'/'+k,o[k]]));},
    remove(){return commit([[p,null]]);},
    once(){const v=get(tree,p);return Promise.resolve({val:()=>v==null?null:JSON.parse(JSON.stringify(v))});},
    on(ev,cb){const l={p,cb,last:undefined};listeners.push(l);setTimeout(fire,0);return cb;},
    off(ev,cb){const i=listeners.findIndex(l=>l.p===p&&(!cb||l.cb===cb));if(i>=0)listeners.splice(i,1);}
  });
  return{ref};
}
function initDB(){
  if(params.get('mock')==='1'){db=mockDB();return true;}
  if(!window.firebase||!FIREBASE_CONFIG.apiKey||FIREBASE_CONFIG.apiKey.includes('여기')||!FIREBASE_CONFIG.databaseURL)return false;
  try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.database();db.ref('.info/serverTimeOffset').on('value',s=>offset=s.val()||0);return true;}catch(e){console.error(e);return false;}
}
const R=(code,sub='')=>db.ref(`${ROOT}/${code}${sub?'/'+sub:''}`);

/* ================= 문제 은행 ================= */
// 게임 1: 별 거리 경매 — 단위 pc
const AUCTION=[
  {type:'num',title:'연주 시차로 거리 구하기',clue:'별 <b>알파</b>의 연주 시차는 <b>0.5″</b>입니다.<br>이 별까지의 거리는 몇 pc일까요?',ans:2,explain:'거리(pc) = 1 ÷ 연주 시차(″) = 1 ÷ 0.5 = <b>2 pc</b>'},
  {type:'num',title:'연주 시차로 거리 구하기',clue:'별 <b>베타</b>의 연주 시차는 <b>0.1″</b>입니다.<br>이 별까지의 거리는 몇 pc일까요?',ans:10,explain:'1 ÷ 0.1 = <b>10 pc</b>. 연주 시차가 작을수록 멀어요.'},
  {type:'num',title:'연주 시차로 거리 구하기',clue:'별 <b>감마</b>의 연주 시차는 <b>0.25″</b>입니다.<br>거리는 몇 pc일까요?',ans:4,explain:'1 ÷ 0.25 = <b>4 pc</b>'},
  {type:'num',title:'함정 주의! 시차 vs 연주 시차',clue:'6개월 간격으로 별 <b>델타</b>를 관측했더니 <b>시차가 0.4″</b>였습니다.<br>이 별까지의 거리는 몇 pc일까요?',ans:5,explain:'연주 시차는 시차의 <b>절반</b> → 0.2″. 거리 = 1 ÷ 0.2 = <b>5 pc</b>'},
  {type:'num',title:'두 등급으로 거리 구하기',clue:'별 <b>엡실론</b>의 겉보기 등급은 <b>3등급</b>, 절대 등급도 <b>3등급</b>입니다.<br>거리는 몇 pc일까요?',ans:10,explain:'두 등급이 같으면 <b>10 pc</b>에 있는 별이에요.'},
  {type:'num',title:'두 등급으로 거리 구하기',clue:'별 <b>제타</b>의 겉보기 등급은 <b>6등급</b>, 절대 등급은 <b>1등급</b>입니다.<br>거리는 몇 pc일까요?<div class="dim" style="margin-top:6px">힌트: 5등급 차이 = 밝기 100배 = 거리 10배</div>',ans:100,explain:'겉보기가 5등급 더 어두움 → 10 pc보다 10배 멀다 → <b>100 pc</b>'},
  {type:'num',title:'두 등급으로 거리 구하기',clue:'별 <b>에타</b>의 겉보기 등급은 <b>2등급</b>, 절대 등급은 <b>7등급</b>입니다.<br>거리는 몇 pc일까요?<div class="dim" style="margin-top:6px">힌트: 5등급 차이 = 밝기 100배 = 거리 10배</div>',ans:1,explain:'겉보기가 5등급 더 밝음 → 10 pc보다 10배 가깝다 → <b>1 pc</b>'},
  {type:'num',title:'광년을 파섹으로',clue:'별 <b>세타</b>에서 출발한 빛이 지구에 오는 데 <b>32.6년</b> 걸렸습니다.<br>이 별까지의 거리는 몇 pc일까요? (1 pc ≈ 3.26 광년)',ans:10,explain:'32.6 광년 ÷ 3.26 = <b>10 pc</b>'},
  {type:'num',title:'광년을 파섹으로',clue:'별 <b>이오타</b>까지의 거리는 <b>326 광년</b>입니다.<br>몇 pc일까요? (1 pc ≈ 3.26 광년)',ans:100,explain:'326 ÷ 3.26 = <b>100 pc</b>'},
  {type:'num',title:'연주 시차로 거리 구하기',clue:'별 <b>카파</b>의 연주 시차는 <b>0.02″</b>입니다.<br>거리는 몇 pc일까요?',ans:50,explain:'1 ÷ 0.02 = <b>50 pc</b>'},
  {type:'choice',title:'더 먼 별은?',clue:'별 A의 연주 시차는 <b>0.3″</b>, 별 B의 연주 시차는 <b>0.05″</b>입니다.<br>지구에서 <b>더 멀리</b> 있는 별은?',opts:['별 A','별 B','거리가 같다','알 수 없다'],ans:1,explain:'연주 시차가 <b>작을수록 멀다</b> → 별 B (20 pc), 별 A는 약 3.3 pc'},
  {type:'choice',title:'10 pc보다 먼 별은?',clue:'<b>시리우스</b>: 겉보기 −1.5, 절대 1.4<br><b>베텔게우스</b>: 겉보기 0.6, 절대 −5.9<br>10 pc보다 <b>멀리</b> 있는 별은?',opts:['시리우스','베텔게우스','둘 다','둘 다 아니다'],ans:1,explain:'겉보기 등급 &gt; 절대 등급이면 10 pc보다 멀다 → <b>베텔게우스</b>'},

function drawSky(cv,sky,mode,opt={}){
  const r=cv.getBoundingClientRect();const dpr=Math.min(devicePixelRatio||1,2);const w=r.width,h=r.height;
  if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.fillStyle='#02040d';c.fillRect(0,0,w,h);
  const u=w/32;
  if(sky.grid){c.strokeStyle='rgba(124,196,255,.18)';c.lineWidth=1;for(let x=0;x<=w;x+=u){c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke();}for(let y=h/2%u;y<=h;y+=u){c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke();}
    c.fillStyle='rgba(4,7,20,.8)';c.fillRect(w-112,6,106,26);c.fillStyle='#7cc4ff';c.font='700 14px "Noto Sans KR",sans-serif';c.textAlign='center';c.fillText(sky.grid,w-59,24);}
  const g=rng(sky.seed);
  const star=(x,y,s,col,a=1)=>{const gr=c.createRadialGradient(x,y,0,x,y,s*3);gr.addColorStop(0,`rgba(255,255,255,${a})`);gr.addColorStop(.3,`rgba(${col},${a*.8})`);gr.addColorStop(1,`rgba(${col},0)`);c.fillStyle=gr;c.beginPath();c.arc(x,y,s*3,0,7);c.fill();};
  for(let i=0;i<sky.n;i++){const x=g()*w,y=g()*h,s=1+g()*2.2,warm=g();if(sky.t.some(t=>Math.hypot(t.x*w-x,t.y*h-y)<u*2.5))continue;star(x,y,s,warm<.3?'255,210,170':warm<.6?'200,215,255':'255,255,240',.95);}
  // 표적 별
  sky.t.forEach(t=>{const pos=m=>[t.x*w+(m==='A'?-1:1)*t.s*u/2,t.y*h];
    const draw=(m,a,col)=>{const[x,y]=pos(m);star(x,y,2.6,col||'255,250,225',a);};
    if(mode==='both'){draw('A',.95,'255,120,120');draw('B',.95,'110,200,255');}else draw(mode,1);
    if(t.l){const[x,y]=pos(mode==='both'?'B':mode);c.font='900 18px "Noto Sans KR",sans-serif';c.textAlign='center';c.fillStyle='rgba(4,7,20,.75)';c.fillRect(x-13,y-36,26,24);c.fillStyle='#ffd36b';c.fillText(t.l,x,y-17);}
    if(opt.reveal){const a=pos('A'),b=pos('B');c.strokeStyle='#6fe0a8';c.lineWidth=2.5;c.beginPath();c.arc(a[0],a[1],12,0,7);c.stroke();c.beginPath();c.arc(b[0],b[1],12,0,7);c.stroke();if(t.s>0){c.beginPath();c.moveTo(a[0],a[1]+20);c.lineTo(b[0],b[1]+20);c.stroke();c.font='900 15px "Noto Sans KR",sans-serif';c.fillStyle='#6fe0a8';c.textAlign='center';c.fillText(`${t.s}칸`,(a[0]+b[0])/2,a[1]+38);}}
  });
  if(opt.tap){const x=opt.tap[0]*w,y=opt.tap[1]*h;c.strokeStyle='#ffd36b';c.lineWidth=3;c.beginPath();c.arc(x,y,18,0,7);c.stroke();c.beginPath();c.moveTo(x-26,y);c.lineTo(x-10,y);c.moveTo(x+10,y);c.lineTo(x+26,y);c.moveTo(x,y-26);c.lineTo(x,y-10);c.moveTo(x,y+10);c.lineTo(x,y+26);c.stroke();}
  c.font='900 15px "Noto Sans KR",sans-serif';c.textAlign='left';c.fillStyle=mode==='A'?'#ff9a9a':mode==='B'?'#8fd0ff':'#fff';c.fillText(mode==='A'?'📷 1월 사진':mode==='B'?'📷 7월 사진':'겹쳐 보기 (빨강 1월 · 파랑 7월)',10,22);
}

function skyViewer(holder,sky,opt={}){
  holder.innerHTML=`<canvas class="sky" style="aspect-ratio:16/10"></canvas><div class="skytools"><button data-m="A">1월 사진</button><button data-m="B">7월 사진</button><button data-m="blink">깜빡이 ▶</button><button data-m="both">겹쳐 보기</button></div>`;
  const cv=$('canvas',holder);let mode='A',blink=opt.reveal?false:true,ph=0,timer=null,tap=null;
  const render=()=>{drawSky(cv,sky,blink?(ph?'B':'A'):mode,{reveal:opt.reveal,tap});$$('.skytools button',holder).forEach(b=>b.classList.toggle('on',b.dataset.m===(blink?'blink':mode)));};
  const setBlink=v=>{blink=v;clearInterval(timer);if(v)timer=setInterval(()=>{if(!document.body.contains(cv)){clearInterval(timer);return;}ph^=1;render();},650);render();};
  $$('.skytools button',holder).forEach(b=>b.onclick=()=>{if(b.dataset.m==='blink')setBlink(!blink);else{mode=b.dataset.m;setBlink(false);}});
  if(opt.onTap)cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect();tap=[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height];render();opt.onTap(tap);});
  if(opt.reveal)mode='both';
  setBlink(blink);
  return{render,stop:()=>clearInterval(timer)};
}
function tapCorrect(sky,tap){const t=sky.t[0];const ar=16/10;return Math.hypot((tap[0]-t.x)*ar,tap[1]-t.y)<0.09+t.s/32/2*ar;}

function hostRun(code){
  H.offs.forEach(f=>f());H.offs=[];clearInterval(H.tick);
  H.code=code;H.players={};H.answers={};H.meta=null;
  const on=(sub,cb)=>{const ref=R(code,sub);const fn=ref.on('value',s=>cb(s.val()));H.offs.push(()=>ref.off('value',fn));};
  on('meta',m=>{const prev=H.meta;H.meta=m;if(!m){home();return;}
    if(!prev||prev.state!==m.state||prev.q!==m.q){if(prev&&prev.q!==m.q){H.answers={};listenAnswers();}hostRender();}});
  on('players',p=>{H.players=p||{};hostPartial();});
  let ansOff=null;
  function listenAnswers(){if(ansOff)ansOff();if(!H.meta||H.meta.q<0){return;}const ref=R(code,'answers/'+H.meta.q);const fn=ref.on('value',s=>{H.answers=s.val()||{};hostPartial();});ansOff=()=>ref.off('value',fn);}
  H.offs.push(()=>ansOff&&ansOff());
  setTimeout(listenAnswers,300);
  H.tick=setInterval(hostTick,250);
}

function rankList(){return Object.entries(H.players).map(([id,p])=>({id,...p,score:p.score||0})).sort((a,b)=>b.score-a.score||(b.correct||0)-(a.correct||0));}
function hostPartial(){
  const m=H.meta;if(!m)return;const ps=H.players,n=Object.keys(ps).length;
  if(m.state==='lobby'&&$('#pl')){$('#pc').textContent=n;$('#pl').innerHTML=Object.values(ps).map(p=>`<span class="chip">${esc(p.name)}</span>`).join('')||'<span class="dim">아직 아무도 없어요…</span>';}
  if(m.state==='question'&&$('#ac')){const a=H.answers;const k=Object.keys(a).length;$('#ac').textContent=k;$('#pc2').textContent=n;$('#al').innerHTML=Object.keys(a).map(id=>`<span class="chip">${esc((ps[id]||{}).name||'?')}</span>`).join('');if(n>0&&k>=n&&!H.revealing)setTimeout(()=>{if(H.meta.state==='question')reveal();},800);}
  if(m.state==='reveal'&&$('#lb')){
    const q=curQ(m);const res=m.results||{};
    $('#lb').innerHTML=rankList().slice(0,8).map((p,i)=>{const d=(res[p.id]||{}).d||0;return`<div class="lbr"><div class="rk">${i+1}</div><div>${esc(p.name)}</div><div class="dl ${d>0?'green':d<0?'red':'dim'}">${d>0?'+'+d:d<0?d:''}</div><div class="sc">${p.score.toLocaleString('ko-KR')}</div></div>`;}).join('');
    // 분포
    const a=Object.values(H.answers);const tot=Math.max(1,a.length);let rows=[];
    if(q.type==='num'){const cnt={};a.forEach(x=>{const k=+x.v;cnt[k]=(cnt[k]||0)+1;});rows=Object.entries(cnt).map(([v,c])=>[v+' pc',c,Math.abs(+v-q.ans)/q.ans<=0.1]).sort((x,y)=>y[1]-x[1]).slice(0,6);}
    else if(q.type==='choice'){rows=q.opts.map((o,i)=>[o,a.filter(x=>x.v===i).length,i===q.ans]);}
    else{const ok=a.filter(x=>tapCorrect(q.sky,x.v)).length;rows=[['찾았어요',ok,true],['다른 별을 눌렀어요',a.length-ok,false]];}
    if($('#dist'))$('#dist').innerHTML=rows.length?rows.map(r=>`<div class="drow"><div>${r[2]?'✅ ':''}${r[0]}</div><div class="dbar"><i class="${r[2]?'ok':''}" style="width:${r[1]/tot*100}%"></i></div><div><b>${r[1]}</b>명</div></div>`).join(''):'<div class="dim">제출한 답이 없어요</div>';
  }
}
function hostTick(){const m=H.meta;if(!m||m.state!=='question'||!$('#tm'))return;const left=Math.max(0,m.qStart+m.dur*1000-now());$('#tm').textContent=Math.ceil(left/1000);$('#tm').style.color=left<10000?'var(--red)':'';$('#tb').style.width=(left/(m.dur*1000)*100)+'%';if(left<=0&&!H.revealing)reveal();}
async function nextQ(){const m=H.meta;H.revealing=false;const q=m.q+1;await R(H.code,'meta').update({state:'question',q,qStart:now()+1500,results:null});}
async function reveal(){
  if(H.revealing)return;H.revealing=true;
  const m=H.meta;const q=curQ(m);const ans=(await R(H.code,'answers/'+m.q).once('value')).val()||{};H.answers=ans;
  const up={};const results={};const last=m.q===m.order.length-1;
  for(const[id,p]of Object.entries(H.players)){
    const a=ans[id];let ok=false,d=0,score=p.score||0;
    if(a){
      if(q.type==='num')ok=Math.abs(+a.v-q.ans)/q.ans<=0.1;else if(q.type==='choice')ok=a.v===q.ans;else ok=tapCorrect(q.sky,a.v);
      if(m.game==='auction'){const mult=last?2:1;const bet=Math.min(a.bet||0,score);d=ok?bet*mult:-bet*mult;}
      else{const rem=clamp((m.qStart+m.dur*1000-a.t)/(m.dur*1000),0,1);d=ok?500+Math.round(500*rem):0;}
    }
    let ns=score+d;let rescue=false;if(m.game==='auction'&&ns<100){rescue=true;ns=100;}
    up[`players/${id}/score`]=ns;up[`players/${id}/correct`]=(p.correct||0)+(ok?1:0);
    results[id]={ok:a?ok:null,d,rescue};
  }
  up['meta/state']='reveal';up['meta/results']=results;
  await R(H.code).update(up);
}
async function switchGame(){
  const m=H.meta;const game=m.game==='auction'?'observe':'auction';const g=GAMES[game];
  let order=g.bank.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,Math.min(8,g.bank.length));
  const up={answers:null,meta:{game,state:'lobby',q:-1,order,dur:g.dur,created:now(),qStart:0}};
  for(const id in H.players){up[`players/${id}/score`]=g.start;up[`players/${id}/correct`]=0;}
  await R(H.code).update(up);
}

let P={code:null,id:null,name:'',meta:null,me:null,myAns:null,offs:[],tick:null,num:'',bet:0.25,choice:null,tap:null,viewer:null};
function joinScreen(code){
  if(!db){app.innerHTML=`<div class="wrap"><div class="warn">게임 서버 설정이 아직 없어요. 선생님께 알려 주세요.</div></div>`;return;}

    <div class="card"><label class="dim">게임방 번호 (4자리)</label><input class="tx" id="jc" inputmode="numeric" maxlength="4" value="${esc(code||'')}" placeholder="0000">
      <label class="dim" style="display:block;margin-top:14px">번호와 이름 (예: 7 홍길동)</label><input class="tx" id="jn" maxlength="12" placeholder="번호 이름" value="${esc(saved&&saved.name||'')}">
      <button class="btn pri" id="jb" style="width:100%;margin-top:18px;min-height:64px;font-size:22px">입장하기 🚀</button><div id="jerr" class="red center" style="margin-top:8px"></div></div></div>`;
  $('#jb').onclick=async()=>{

    if(n.length<2){$('#jerr').textContent='번호와 이름을 입력하세요';return;}
    $('#jb').disabled=true;
    const m=(await R(c,'meta').once('value')).val();
    if(!m){$('#jerr').textContent='게임방을 찾을 수 없어요. 번호를 확인하세요';$('#jb').disabled=false;return;}
    let id=saved&&saved.code===c&&saved.id;

    if(!id){id='p'+Math.random().toString(36).slice(2,10);await R(c,'players/'+id).set({name:n,score:GAMES[m.game].start,correct:0,joined:now()});}
    else await R(c,'players/'+id+'/name').set(n);

    playRun(c,id,n);
  };

function playRun(code,id,name){
  P.offs.forEach(f=>f());P.offs=[];clearInterval(P.tick);
  Object.assign(P,{code,id,name,meta:null,me:null,myAns:null});
  const on=(sub,cb)=>{const ref=R(code,sub);const fn=ref.on('value',s=>cb(s.val()));P.offs.push(()=>ref.off('value',fn));};
  on('meta',m=>{const prev=P.meta;P.meta=m;if(!m){app.innerHTML='<div class="wrap"><div class="waiting">게임방이 닫혔어요. 수고했어요! 👋</div></div>';P.offs.forEach(f=>f());return;}
    if(!prev||prev.state!==m.state||prev.q!==m.q||prev.game!==m.game){if(!prev||prev.q!==m.q||prev.game!==m.game){P.myAns=null;P.num='';P.choice=null;P.tap=null;P.bet=0.25;listenMine();}playRender();}});
  on('players/'+id,me=>{P.me=me;if(!me&&P.meta){app.innerHTML='<div class="wrap"><div class="waiting">게임방에서 나갔어요.</div></div>';return;}const s=$('#mysc');if(s&&me)s.textContent=fmtScore(me.score);});
  let off=null;function listenMine(){if(off)off();if(!P.meta||P.meta.q<0)return;const ref=R(code,`answers/${P.meta.q}/${id}`);const fn=ref.on('value',s=>{const had=P.myAns;P.myAns=s.val();if(!had&&P.myAns&&P.meta.state==='question')playRender();});off=()=>ref.off('value',fn);}
  P.offs.push(()=>off&&off());
  P.tick=setInterval(playTick,250);
}
const fmtScore=s=>(s||0).toLocaleString('ko-KR')+(P.meta&&P.meta.game==='auction'?' 코인':'점');

  a.t=now();await R(P.code,`answers/${m.q}/${P.id}`).set(a);P.myAns=a;playRender();
}
function playTick(){const m=P.meta;const el=$('#ptm');if(!m||!el)return;if(m.state!=='question'){el.textContent='';return;}const left=Math.max(0,m.qStart+m.dur*1000-now());el.innerHTML=left>m.dur*1000?'준비…':`⏱ <b style="color:${left<10000?'var(--red)':'var(--text)'};font-size:20px">${Math.ceil(left/1000)}</b>초`;if(left<=0&&!P.myAns&&$('#sub')){$('#sub').disabled=true;$('#sub').textContent='시간 종료';}}

/* ================= 시작 ================= */
const ok=initDB();
(function(){
  if(ok&&!params.get('room')){let hc=null;try{hc=localStorage.getItem('sg_host');}catch(e){}
    if(hc){R(hc,'meta').once('value').then(s=>{const m=s.val();if(m&&now()-m.created<6*3600e3&&confirm(`진행 중이던 게임방 ${hc}으로 돌아갈까요?`)){hostRun(hc);}else{try{localStorage.removeItem('sg_host');}catch(e){}home();}});return;}}
  home();
})();
</script>
